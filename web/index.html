<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme and reduced motion before first paint. Keys mirror features/prefs/theme.ts.
      (function () {
        var d = document.documentElement, t = "dark", r = false;
        try { t = localStorage.getItem("tacit.theme") || "dark"; r = localStorage.getItem("tacit.reduceMotion") === "true"; } catch (e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "light") d.dataset.theme = "light";
        if (r || matchMedia("(prefers-reduced-motion: reduce)").matches) d.dataset.reduceMotion = "";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
